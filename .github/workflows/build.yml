---
name: Build

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "12 1 * * 0"

jobs:
  # Test the image builds and works correctly.
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Test building image.
        run: docker build -t docker-ansible .

      - name: Run the built image.
        run: >-
          docker run --name test-container -d --privileged
          -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host
          docker-ansible

      - name: Verify Ansible is accessible in the built image.
        run: |
          docker exec test-container rpm -q ansible ansible-core
          docker exec test-container ansible --version
          docker exec test-container ansible -i /etc/ansible/hosts local -m ping

      - name: Verify ALT Linux and systemd.
        run: |
          docker exec test-container sh -c 'test "$(. /etc/os-release; echo "$ID")" = altlinux'
          docker exec test-container sh -c 'test "$(. /etc/os-release; echo "$ALT_BRANCH_ID")" = c10f2'
          docker exec test-container sh -c 'test "$(cat /proc/1/comm)" = systemd'

  # If on main branch, build and release image.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      IMAGE_REPO: ghcr.io
      IMAGE_USER: pertsevds
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.IMAGE_REPO == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REPO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check external registry credentials
        if: env.IMAGE_REPO != 'ghcr.io'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo '::error::Set REGISTRY_USERNAME and REGISTRY_TOKEN secrets for an external registry.'
            exit 1
          fi

      - name: Login to external registry
        if: env.IMAGE_REPO != 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REPO }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push image.
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_REPO }}/${{ env.IMAGE_USER }}/alt-c10f2-ansible:latest
