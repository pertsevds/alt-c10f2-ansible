---
name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "12 1 * * 0"

concurrency:
  group: image-release-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io
  IMAGE_USER: pertsevds

jobs:
  # Test the image builds and works correctly.
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ansible on the runner.
        run: |
          python -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/python" -m pip install --no-cache-dir ansible
          "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install community.docker
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"

      - name: Test building image.
        run: docker build -t docker-ansible .

      - name: Run the built image.
        run: >-
          docker run --name test-container -d --privileged
          -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host
          docker-ansible

      - name: Verify the image is a managed target.
        run: |
          docker exec test-container python3 --version
          docker exec test-container sh -c 'for tool in python3 sudo systemctl wget ps ip ss dbus-daemon; do command -v "$tool" || exit 1; done'
          docker exec test-container sh -c '! command -v ansible && test ! -e /etc/ansible/hosts'

      - name: Verify Ansible can manage the container from the runner.
        run: |
          ansible --version
          target=(test-container -i 'test-container,' -c community.docker.docker -u root -e ansible_python_interpreter=/usr/bin/python3)
          ansible "${target[@]}" -m ansible.builtin.ping
          ansible "${target[@]}" -m ansible.builtin.setup
          ansible "${target[@]}" -m ansible.builtin.systemd_service -a 'name=dbus state=started'

      - name: Verify ALT Linux and systemd.
        run: |
          docker exec test-container sh -c 'test "$(. /etc/os-release; echo "$ID")" = altlinux'
          docker exec test-container sh -c 'test "$(. /etc/os-release; echo "$ALT_BRANCH_ID")" = c10f2'
          docker exec test-container sh -c 'test "$(cat /proc/1/comm)" = systemd'

      - name: Test GHCR retention selection
        run: python3 -m unittest discover -s tests

      - name: Remove the test container.
        if: always()
        run: docker rm -f test-container

  # Build each architecture on a native runner to avoid QEMU during RPM transactions.
  release:
    name: Release ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.IMAGE_REPO == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REPO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check external registry credentials
        if: env.IMAGE_REPO != 'ghcr.io'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo '::error::Set REGISTRY_USERNAME and REGISTRY_TOKEN secrets for an external registry.'
            exit 1
          fi

      - name: Login to external registry
        if: env.IMAGE_REPO != 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REPO }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push architecture image.
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE_REPO }}/${{ env.IMAGE_USER }}/alt-c10f2-ansible:latest-${{ matrix.arch }}

  release_manifest:
    name: Release multi-platform image
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.IMAGE_REPO == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REPO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check external registry credentials
        if: env.IMAGE_REPO != 'ghcr.io'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo '::error::Set REGISTRY_USERNAME and REGISTRY_TOKEN secrets for an external registry.'
            exit 1
          fi

      - name: Login to external registry
        if: env.IMAGE_REPO != 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REPO }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Create and verify multi-platform image
        run: |
          image="${IMAGE_REPO}/${IMAGE_USER}/alt-c10f2-ansible"
          docker buildx imagetools create \
            --tag "${image}:latest" \
            "${image}:latest-amd64" \
            "${image}:latest-arm64"
          docker buildx imagetools inspect --raw "${image}:latest" | \
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] |
                   index("amd64") != null and index("arm64") != null'

  retention:
    name: Delete unreferenced GHCR versions
    runs-on: ubuntu-latest
    needs: release_manifest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        if: env.IMAGE_REPO == 'ghcr.io'
      - uses: docker/setup-buildx-action@v4
        if: env.IMAGE_REPO == 'ghcr.io'
      - name: Login to GHCR
        if: env.IMAGE_REPO == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete unreferenced versions
        if: env.IMAGE_REPO == 'ghcr.io'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ghcr_retention.py
